{% extends "base.html" %}
{% block title %}Resumen{% endblock %}
{% block content %}

<h2 class="mb-4">Resumen</h2>

<div id="resumen-panel">
  {% include "partials/_resumen_tabs.html" %}
</div>

<div class="alert {{ 'alert-danger' if por_validar else 'alert-success' }} d-flex justify-content-between align-items-center mt-4">
  <span>{% if por_validar %}Hay {{ por_validar }} día(s) con entregas sin validar.{% else %}Nada por validar.{% endif %}</span>
  <a href="/hoy" class="btn btn-sm btn-outline-dark">Ir a Hoy</a>
</div>

{% endblock %}
