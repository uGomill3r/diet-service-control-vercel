{% extends "base.html" %}
{% block title %}Reporte de entregas por ciclo{% endblock %}

{% block content %}
<h2 class="mb-4">Reporte de entregas por ciclo</h2>
<div id="reporte-contenido">
  {% include "partials/_reporte.html" %}
</div>
{% endblock %}

{% block scripts %}
<script>
function copiarTabla() {
  const tabla = document.getElementById('tablaReporte');
  if (!tabla) { mostrarToast('No se encontró la tabla'); return; }
  let texto = '';
  for (let fila of tabla.rows) {
    let filaTexto = [];
    for (let celda of fila.cells) filaTexto.push(celda.innerText);
    texto += filaTexto.join('\t') + '\n';
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto)
      .then(() => mostrarToast('Tabla copiada al portapapeles', 'success'))
      .catch(err => mostrarToast('Error al copiar: ' + err));
  } else {
    mostrarToast('Tu navegador no permite copiar al portapapeles automáticamente.');
  }
}
</script>
{% endblock %}
