{% extends "base.html" %}
{% block title %}Registro de pagos{% endblock %}
{% block content %}

<h2 class="mb-4">Registro de pagos</h2>

<div class="card shadow-sm mb-4">
  <div class="card-body">
    <form method="POST" class="row g-3"
      hx-post="{{ url_for('pagos.pagos') }}" hx-target="#pagos-listas" hx-swap="innerHTML"
      hx-disabled-elt="find button[type=submit]"
      hx-on::after-request="if (event.detail.successful) { this.reset(); this.querySelectorAll('.flatpickr-date').forEach(function (e) { if (e._flatpickr) e._flatpickr.clear(); }); }">
      {% csrf_token %}
      <div class="col-md-3">
        <label class="form-label">Fecha del pago</label>
        <input type="text" name="fecha" class="form-control flatpickr-date" placeholder="DD/MM/AAAA" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Tipo de comida</label>
        <select name="tipo" class="form-select" required>
          <option value="almuerzo">Almuerzo</option>
          <option value="cena">Cena</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Cantidad de comidas</label>
        <input type="number" name="cantidad" class="form-control" min="1" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Monto total pagado</label>
        <input type="number" name="monto" class="form-control" step="0.01" min="0" required>
      </div>
      <div class="col-12 text-end">
        <button type="submit" class="btn btn-primary">Registrar pago</button>
      </div>
    </form>
  </div>
</div>

<div id="pagos-listas">
  {% include "partials/_pagos_listas.html" %}
</div>

<a href="/" class="btn btn-secondary">Volver al inicio</a>

{% endblock %}
